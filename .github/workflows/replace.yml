name: replace-source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace tracked files from snapshot
        run: |
          set -euo pipefail
          cp snapshot.tar.gz /tmp/snapshot.tar.gz
          git rm -r --ignore-unmatch .
          git checkout HEAD -- .github/workflows/replace.yml
          tar -xzf /tmp/snapshot.tar.gz
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace repository with FundDesk Tauri source"
          git push
