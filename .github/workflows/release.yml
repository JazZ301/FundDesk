name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      body: ${{ steps.meta.outputs.body }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi
          notes="release-notes/v${version}.md"
          if [ -f "$notes" ]; then
            body=$(cat "$notes")
          else
            body="FundDesk（基金看板）v${version}。完整变更请查看提交记录。"
          fi
          {
            echo "version=${version}"
            echo "body<<RELEASE_BODY_EOF"
            echo "$body"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p funddesk-core

  bundle:
    needs: [meta, test-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            artifact: macOS
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: Windows
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Configure Apple signing
        if: matrix.os == 'macos-15'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              eval "value=\${$name:-}"
              if [ -n "$value" ]; then
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
              fi
            done
          fi
      - name: Import Windows signing certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "No Windows signing certificate configured."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "funddesk.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path tauri.signing.conf.json -Value $config -Encoding utf8
          "TAURI_EXTRA_ARGS=--config $env:GITHUB_WORKSPACE\tauri.signing.conf.json" >> $env:GITHUB_ENV
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          args: --target ${{ matrix.target }} ${{ env.TAURI_EXTRA_ARGS }}
      - name: Prepare mirrored update manifest
        if: matrix.os == 'macos-15'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          latest="target/universal-apple-darwin/release/bundle/latest.json"
          if [ ! -f "$latest" ]; then
            echo "::error::tauri-action did not generate $latest" >&2
            exit 1
          fi
          cp "$latest" "latest.json"
          node - "$version" <<'NODE'
          const fs = require('fs');
          const version = process.argv[2];
          const data = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          for (const platform of Object.values(data.platforms ?? {})) {
            if (typeof platform.url !== 'string') continue;
            platform.url = platform.url.replace(
              'https://github.com/',
              'https://ghfast.top/github.com/'
            );
          }
          fs.writeFileSync(`latest-cn-${version}.json`, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        id: upload-bundles
        with:
          name: release-${{ matrix.artifact }}-${{ github.run_attempt }}
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/macos/*.app.tar.gz
            target/**/bundle/macos/*.app.tar.gz.sig
            target/**/bundle/nsis/*.exe
            target/**/bundle/nsis/*.exe.sig
            target/**/bundle/msi/*.msi
            target/**/bundle/msi/*.msi.sig
            target/**/bundle/msi/*.msi.zip
            target/**/bundle/msi/*.msi.zip.sig
            latest.json
            latest-cn-*.json
          if-no-files-found: error

  require-bundles:
    needs: bundle
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one bundle job to succeed
        shell: bash
        env:
          BUNDLE_RESULT: ${{ needs.bundle.result }}
        run: |
          echo "bundle matrix result: ${BUNDLE_RESULT}"
          if [ "${BUNDLE_RESULT}" != "success" ]; then
            echo "::error::All bundle jobs failed"
            exit 1
          fi
