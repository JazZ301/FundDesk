name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi
          test -s "release-notes/v${version}.md"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p funddesk-core

  bundle:
    needs: [meta, test-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            artifact: macOS
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Configure Apple signing
        if: matrix.os == 'macos-15'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              eval "value=\${$name:-}"
              if [ -n "$value" ]; then
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
              fi
            done
          fi
      - name: Import Windows signing certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "No Windows signing certificate configured."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "funddesk.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path tauri.signing.conf.json -Value $config -Encoding utf8
          "TAURI_EXTRA_ARGS=--config $env:GITHUB_WORKSPACE\tauri.signing.conf.json" >> $env:GITHUB_ENV
      - name: Build signed updater bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.artifact == 'macOS' && 'app,dmg' || 'nsis' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          args=()
          if [[ -n "${TAURI_EXTRA_ARGS:-}" ]]; then
            args=(--config "$GITHUB_WORKSPACE/tauri.signing.conf.json")
          fi
          pnpm tauri build --target "$TARGET" --bundles "$BUNDLES" "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}-${{ github.run_attempt }}
          path: |
            target/**/bundle/dmg/*.dmg
            target/**/bundle/macos/*.app.tar.gz
            target/**/bundle/macos/*.app.tar.gz.sig
            target/**/bundle/nsis/*-setup.exe
            target/**/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish:
    needs: [meta, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*-${{ github.run_attempt }}
          path: bundles
      - name: Prepare and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          python3 scripts/prepare-release.py "$RELEASE_VERSION" "$GITHUB_REPOSITORY" bundles publish "$notes"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > release-state; then
            if [[ "$(cat release-state)" != true ]]; then
              echo "::error::Release already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" publish/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" publish/* --draft --verify-tag --title "基金看板 $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
