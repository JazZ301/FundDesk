<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>基金看板</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header class="top row spread">
    <div class="brand"><img class="brand-icon" src="icons/funddesk-48.png" alt=""><h1>基金看板</h1></div>
    <div class="row"><output id="status" aria-live="polite"></output><button id="refresh" type="button">刷新</button><button class="primary" id="add" type="button">添加基金</button></div>
  </header>
  <div class="shell">
    <nav id="navigation" aria-label="看板"></nav>
    <main class="stack">
      <section id="indexes" class="indexes" aria-label="市场指数"></section>
      <div id="content" class="stack"></div>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="dialog-title"></dialog>
  <script type="module" src="board.js"></script>
</body>
</html>
